name: Automations Cron

on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call automations runner
        env:
          URL: https://www.diamond-booking.com/api/automations/run
          SECRET: ${{ secrets.AUTOMATIONS_CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "Missing GitHub secret: AUTOMATIONS_CRON_SECRET"
            exit 1
          fi
          curl -sS --fail-with-body -X GET "$URL" -H "Authorization: Bearer $SECRET"
